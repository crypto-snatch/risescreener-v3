name: Refresh historical data

# Public RPC updates completed UTC days without an API key.
# Dune is optional and requires a funded DUNE_API_KEY repository secret.

on:
  schedule:
    - cron: "15 0 * * *" # 00:15 UTC leaves a full-block confirmation buffer after midnight
  workflow_dispatch:
    inputs:
      use_dune:
        description: Also refresh Dune using a funded API key (optional)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh-dune
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch Dune data
        if: inputs.use_dune == true || vars.ENABLE_DUNE_REFRESH == 'true'
        continue-on-error: true
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
        run: node scripts/fetch-dune.mjs
      - name: Collect complete UTC days from free public RPC
        run: node scripts/snapshot-rpc-history.mjs
      - name: Refresh daily recap
        run: node scripts/snapshot-summary.mjs
      - name: Commit & push (race-safe)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dune.json data/rpc-history.json data/summary.json
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "chore: refresh historical data from public RPC [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main || exit 1
            if git push; then exit 0; fi
            sleep 5
          done
          echo "Push failed after 3 attempts"
          exit 1
